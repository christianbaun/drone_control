[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-control"
version = "0.1.0"
description = "Einfache, überwachte ArduCopter-Abläufe über MAVLink"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["pymavlink>=2.4.49,<3", "pyserial>=3.5,<4"]

[project.scripts]
drone-control = "drone_control.cli:main"

[tool.setuptools.packages.find]
include = ["drone_control*"]
